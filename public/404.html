<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Career Radar</title>
    <script>
      // Single Page Apps for GitHub Pages (spa-github-pages pattern).
      // A deep link like /jobs hits this 404 page; it redirects to /?/jobs
      // and the restore script in index.html puts the path back.
      (function () {
        var l = window.location;
        var segmentCount = 0; // user site served from domain root
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
